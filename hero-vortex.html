<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الدوائر المتحركة - Hero Vortex</title>
<style>
  /* ===== الألوان والإعدادات (عدّلها كما تشاء) ===== */
  :root {
    --brand: 243 75% 59%;
    --brand-violet: 262 83% 58%;
    --brand-teal: 175 74% 32%;
    --vortex-speed: 9s;
    --vortex-opacity: .55;
    --vortex-line: .34;
  }

  /* ===== أساسيات الصفحة (للعرض فقط، يمكن حذفها عند النسخ) ===== */
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Cairo", "Segoe UI", Tahoma, sans-serif;
    color: #1a1d3a;
  }

  /* ===== بداية كود الدوائر: انسخ من هنا ===== */
  .hero-scene {
    position: relative;
    overflow: hidden;
    isolation: isolate;
    background:
      radial-gradient(38% 30% at 50% 58%, hsl(var(--brand) / .22) 0%, transparent 70%),
      radial-gradient(50% 44% at 12% 8%,  hsl(var(--brand-violet) / .22) 0%, transparent 70%),
      radial-gradient(44% 40% at 92% 14%, hsl(var(--brand-teal) / .18) 0%, transparent 70%),
      linear-gradient(180deg, #fbfbfe, #f4f3fc 46%, #eae9f7);
  }

  .hero-vortex {
    position: absolute;
    left: 50%;
    top: 58%;
    width: 150%;
    aspect-ratio: 1;
    transform: translate(-50%, -50%) perspective(760px) rotateX(62deg);
    transform-origin: 50% 50%;
    opacity: var(--vortex-opacity);
    -webkit-mask-image: radial-gradient(closest-side, #000 50%, transparent 100%);
            mask-image: radial-gradient(closest-side, #000 50%, transparent 100%);
    pointer-events: none;
    z-index: 0;
  }

  .hero-vortex::before {
    content: "";
    position: absolute;
    inset: -20%;
    background: repeating-radial-gradient(
      circle at 50% 50%,
      hsl(var(--brand) / 0) 0,
      hsl(var(--brand) / 0) 15px,
      hsl(var(--brand) / var(--vortex-line)) 15.5px,
      hsl(var(--brand) / var(--vortex-line)) 16.5px,
      hsl(var(--brand) / 0) 17px,
      hsl(var(--brand) / 0) 18px
    );
  }

  @media (prefers-reduced-motion: no-preference) {
    .hero-vortex::before {
      animation: heroVortexBreathe var(--vortex-speed) ease-in-out infinite;
    }
  }

  @keyframes heroVortexBreathe {
    0%, 100% { transform: scale(1);     opacity: .9; }
    50%      { transform: scale(1.045); opacity: 1;  }
  }

  .hero-vortex.flat { transform: translate(-50%, -50%); }

  .hero-content { position: relative; z-index: 1; }
  /* ===== نهاية كود الدوائر ===== */

  /* ===== تنسيق صفحة العرض ===== */
  .hero-scene { min-height: 100vh; display: grid; place-items: center; }
  .hero-content { text-align: center; padding: 2rem; max-width: 40rem; }
  .hero-content h1 { font-size: clamp(2rem, 5vw, 3.5rem); margin: 0 0 1rem; }
  .hero-content p { font-size: 1.1rem; line-height: 1.8; margin: 0; }
</style>
</head>
<body>

  <!-- ===== الهيكل: انسخ هذا الجزء إلى موقعك ===== -->
  <section class="hero-scene">
    <div class="hero-vortex"></div>
    <div class="hero-content">
      <h1>عنوان موقعك هنا</h1>
      <p>المحتوى يظهر فوق الدوائر المتحركة. انسخ كود الـ CSS بين التعليقين وضعه في موقعك، ثم أضف الهيكل أعلاه.</p>
    </div>
  </section>

</body>
</html>
